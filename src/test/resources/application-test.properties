spring.datasource.url=jdbc:h2:mem:roomix_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Pruebas: sin datos de demostración, usuarios por rol con contraseña conocida y JWT fijo
app.seed.enabled=false
app.seed.usuarios-demo=true
app.seed.admin-password=Roomix2026*
app.seed.demo-password=Roomix2026*
app.security.jwt-secret=clave-de-pruebas-roomix-0123456789
logging.level.com.example.roomix=WARN
