spring.application.name=roomix
# Railway / Render inyectan PORT; en local se usa 8080
server.port=${PORT:8080}

# Valores locales sin tocar este archivo: copia application-local.properties.example
# (en despliegue ese archivo no existe y todo se toma de variables de entorno)
spring.config.import=optional:classpath:application-local.properties

# Zona horaria del negocio: variable APP_TIMEZONE (por defecto America/Bogota), ver RoomixApplication

# -----------------------------------------------------------------------------
# PostgreSQL
# Opción A: DB_URL (jdbc:postgresql://host:5432/db?sslmode=require) + DB_USERNAME + DB_PASSWORD
# Opción B: DATABASE_URL (postgresql://user:pass@host:5432/db), formato de Railway, Render y Neon.
#           DatabaseUrlEnvironmentPostProcessor la convierte a JDBC automáticamente.
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roomix}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Planes gratuitos (Neon, Render, Railway) limitan conexiones: pool pequeño por defecto
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# CORS: orígenes del frontend separados por coma. Admite comodines (https://*.vercel.app)
# https://localhost es el origen de la app Android (Capacitor); inclúyelo también en producción
# -----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173,https://localhost}

# -----------------------------------------------------------------------------
# Seguridad (JWT + BCrypt)
# JWT_SECRET: cadena larga y aleatoria (mín. 32 caracteres). Si falta, se genera una al arrancar
#             y las sesiones se pierden en cada reinicio.
# -----------------------------------------------------------------------------
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiration-horas=${JWT_EXPIRATION_HOURS:8}
# URL pública del frontend (para el enlace de recuperación de contraseña)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Usuarios iniciales (solo si la tabla de usuarios está vacía)
app.seed.admin-username=${ADMIN_USERNAME:admin}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.usuarios-demo=${APP_DEMO_USERS:true}
app.seed.demo-password=${DEMO_USERS_PASSWORD:}

# Correo (opcional) para recuperación de contraseña. Defina SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD y MAIL_FROM para habilitarlo.
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -----------------------------------------------------------------------------
# Datos iniciales: con APP_SEED_ENABLED=true se ejecuta db/seed-data.sql al arrancar,
# solo si la base no tiene habitaciones (no pisa datos existentes).
# -----------------------------------------------------------------------------
app.seed.enabled=${APP_SEED_ENABLED:false}

# -----------------------------------------------------------------------------
# Datos del hotel (comprobantes y facturas) e impuestos
# -----------------------------------------------------------------------------
app.hotel.nombre=${HOTEL_NOMBRE:Hotel Roomix}
app.hotel.nit=${HOTEL_NIT:900.000.000-0}
app.hotel.direccion=${HOTEL_DIRECCION:Calle del Arsenal # 10-25}
app.hotel.ciudad=${HOTEL_CIUDAD:Cartagena de Indias, Colombia}
app.hotel.telefono=${HOTEL_TELEFONO:+57 605 000 0000}
app.hotel.email=${HOTEL_EMAIL:reservas@roomix.test}
app.hotel.prefijo-factura=${HOTEL_PREFIJO_FACTURA:FV}
app.hotel.iva-porcentaje=${HOTEL_IVA:19}
# Servicios turísticos a no residentes (pasaporte extranjero) exentos de IVA (art. 481 E.T.)
app.hotel.exento-iva-extranjeros=${HOTEL_EXENTO_IVA_EXTRANJEROS:true}

# Fotos de habitaciones
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Health check para la plataforma de despliegue: GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI (SWAGGER_ENABLED=false para ocultarlo en producción)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false
